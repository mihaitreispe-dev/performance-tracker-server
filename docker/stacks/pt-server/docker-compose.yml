services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      # Module enablement
      - API_V1_MODULE_ENABLED=${API_V1_MODULE_ENABLED:-Y}
      - API_V1_PORT=${API_V1_PORT:-5100}
      - CRON_MODULE_ENABLED=${CRON_MODULE_ENABLED:-N}
      # API URL
      - API_V1_URL=${API_V1_URL}
      # Database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=${DB_SSL}
      # Auth
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRY=${JWT_ACCESS_TOKEN_EXPIRY}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_EXPIRY=${JWT_REFRESH_TOKEN_EXPIRY}
      # Swagger
      - SWAGGER_USERNAME=${SWAGGER_USERNAME}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD}
      # AWS
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      # S3
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION}
      - S3_UPLOAD_BUCKET=${S3_UPLOAD_BUCKET}
      - S3_CONTENT_BUCKET=${S3_CONTENT_BUCKET}
      # CDN
      - CDN_URL=${CDN_URL}
      - DISABLE_CDN=${DISABLE_CDN:-N}
      # CloudFront
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY}
      # Firebase
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      # MediaConvert
      - MEDIA_CONVERT_REGION=${MEDIA_CONVERT_REGION}
      - MEDIA_CONVERT_ROLE=${MEDIA_CONVERT_ROLE}
      - MEDIA_CONVERT_QUEUE=${MEDIA_CONVERT_QUEUE}
      - DISABLE_MEDIA_CONVERT=${DISABLE_MEDIA_CONVERT:-N}
      # Strava Integration
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI}
      - STRAVA_WEBHOOK_VERIFY_TOKEN=${STRAVA_WEBHOOK_VERIFY_TOKEN}
      # Garmin Integration
      - GARMIN_CONSUMER_KEY=${GARMIN_CONSUMER_KEY:-}
      - GARMIN_CONSUMER_SECRET=${GARMIN_CONSUMER_SECRET:-}
      - GARMIN_REDIRECT_URI=${GARMIN_REDIRECT_URI:-}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      # OpenWearables
      - OPENWEARABLES_API_URL=http://openwearables:8000/api/v1
      - OPENWEARABLES_API_KEY=${OPENWEARABLES_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pt-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5100/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pt-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  openwearables:
    image: ${OPENWEARABLES_IMAGE}
    restart: unless-stopped
    command: scripts/start/app.sh
    env_file:
      - ./openwearables.env
    environment:
      - DB_HOST=${OW_DB_HOST:-${DB_HOST}}
      - DB_PORT=${OW_DB_PORT:-${DB_PORT}}
      - DB_NAME=${OW_DB_NAME}
      - DB_USER=${OW_DB_USER:-${DB_USER}}
      - DB_PASSWORD=${OW_DB_PASSWORD:-${DB_PASSWORD}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pt-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openwearables-worker:
    image: ${OPENWEARABLES_IMAGE}
    restart: unless-stopped
    command: scripts/start/worker.sh
    env_file:
      - ./openwearables.env
    environment:
      - DB_HOST=${OW_DB_HOST:-${DB_HOST}}
      - DB_PORT=${OW_DB_PORT:-${DB_PORT}}
      - DB_NAME=${OW_DB_NAME}
      - DB_USER=${OW_DB_USER:-${DB_USER}}
      - DB_PASSWORD=${OW_DB_PASSWORD:-${DB_PASSWORD}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      openwearables:
        condition: service_started
    networks:
      - pt-server

  openwearables-beat:
    image: ${OPENWEARABLES_IMAGE}
    restart: unless-stopped
    command: scripts/start/beat.sh
    env_file:
      - ./openwearables.env
    environment:
      - DB_HOST=${OW_DB_HOST:-${DB_HOST}}
      - DB_PORT=${OW_DB_PORT:-${DB_PORT}}
      - DB_NAME=${OW_DB_NAME}
      - DB_USER=${OW_DB_USER:-${DB_USER}}
      - DB_PASSWORD=${OW_DB_PASSWORD:-${DB_PASSWORD}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      openwearables:
        condition: service_started
    networks:
      - pt-server

volumes:
  redis_data:

networks:
  pt-server:
    driver: bridge

name: deploy-staging

on:
  push:
    branches: [deploy-staging]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}/pt-server
  OPENWEARABLES_IMAGE_NAME: ${{ github.repository }}/pt-openwearables
  DEPLOY_DIR: /opt/pt-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      openwearables_image: ${{ steps.meta.outputs.openwearables_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          API_IMAGE="${REGISTRY}/${API_IMAGE_NAME}:${{ github.sha }}"
          OW_IMAGE="${REGISTRY}/${OPENWEARABLES_IMAGE_NAME}:${{ github.sha }}"
          echo "api_image=${API_IMAGE,,}" >> $GITHUB_OUTPUT
          echo "openwearables_image=${OW_IMAGE,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push OpenWearables image
        uses: docker/build-push-action@v6
        with:
          context: ./openwearables/backend
          file: ./openwearables/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.openwearables_image }}
          cache-from: type=gha,scope=openwearables
          cache-to: type=gha,mode=max,scope=openwearables

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat <<'EOF' > .env
          API_IMAGE=${{ needs.build-and-push.outputs.api_image }}
          OPENWEARABLES_IMAGE=${{ needs.build-and-push.outputs.openwearables_image }}
          # Module enablement
          API_V1_MODULE_ENABLED=Y
          API_V1_PORT=5100
          CRON_MODULE_ENABLED=N
          # API URL
          API_V1_URL=${{ vars.API_V1_URL_STAGING }}
          # Database
          DB_HOST=${{ secrets.DB_HOST_STAGING }}
          DB_PORT=${{ secrets.DB_PORT_STAGING }}
          DB_USER=${{ secrets.DB_USER_STAGING }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD_STAGING }}
          DB_NAME=${{ secrets.DB_NAME_STAGING }}
          DB_SSL=${{ vars.DB_SSL_STAGING }}
          # Auth
          JWT_ACCESS_TOKEN_SECRET=${{ secrets.JWT_ACCESS_TOKEN_SECRET_STAGING }}
          JWT_ACCESS_TOKEN_EXPIRY=${{ vars.JWT_ACCESS_TOKEN_EXPIRY_STAGING }}
          JWT_REFRESH_TOKEN_SECRET=${{ secrets.JWT_REFRESH_TOKEN_SECRET_STAGING }}
          JWT_REFRESH_TOKEN_EXPIRY=${{ vars.JWT_REFRESH_TOKEN_EXPIRY_STAGING }}
          # Swagger
          SWAGGER_USERNAME=${{ secrets.SWAGGER_USERNAME_STAGING }}
          SWAGGER_PASSWORD=${{ secrets.SWAGGER_PASSWORD_STAGING }}
          # AWS
          AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_STAGING }}
          AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY_STAGING }}
          # S3
          S3_REGION=${{ vars.S3_REGION_STAGING }}
          S3_UPLOAD_BUCKET=${{ vars.S3_UPLOAD_BUCKET_STAGING }}
          S3_CONTENT_BUCKET=${{ vars.S3_CONTENT_BUCKET_STAGING }}
          # CDN
          CDN_URL=${{ vars.CDN_URL_STAGING }}
          DISABLE_CDN=${{ vars.DISABLE_CDN_STAGING }}
          # CloudFront
          CLOUDFRONT_KEY_PAIR_ID=${{ secrets.CLOUDFRONT_KEY_PAIR_ID_STAGING }}
          CLOUDFRONT_PRIVATE_KEY=${{ secrets.CLOUDFRONT_PRIVATE_KEY_STAGING }}
          # Firebase
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL_STAGING }}
          FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY_STAGING }}
          # MediaConvert
          MEDIA_CONVERT_REGION=${{ vars.MEDIA_CONVERT_REGION_STAGING }}
          MEDIA_CONVERT_ROLE=${{ secrets.MEDIA_CONVERT_ROLE_STAGING }}
          MEDIA_CONVERT_QUEUE=${{ secrets.MEDIA_CONVERT_QUEUE_STAGING }}
          DISABLE_MEDIA_CONVERT=${{ vars.DISABLE_MEDIA_CONVERT_STAGING }}
          # Strava Integration
          STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID_STAGING }}
          STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET_STAGING }}
          STRAVA_REDIRECT_URI=${{ vars.STRAVA_REDIRECT_URI_STAGING }}
          STRAVA_WEBHOOK_VERIFY_TOKEN=${{ secrets.STRAVA_WEBHOOK_VERIFY_TOKEN_STAGING }}
          # Garmin Integration
          GARMIN_CONSUMER_KEY=${{ secrets.GARMIN_CONSUMER_KEY_STAGING }}
          GARMIN_CONSUMER_SECRET=${{ secrets.GARMIN_CONSUMER_SECRET_STAGING }}
          GARMIN_REDIRECT_URI=${{ vars.GARMIN_REDIRECT_URI_STAGING }}
          # OpenWearables bridge
          OPENWEARABLES_API_KEY=${{ secrets.OPENWEARABLES_API_KEY_STAGING }}
          OW_DB_HOST=${{ secrets.OW_DB_HOST_STAGING }}
          OW_DB_PORT=${{ secrets.OW_DB_PORT_STAGING }}
          OW_DB_NAME=${{ secrets.OW_DB_NAME_STAGING }}
          OW_DB_USER=${{ secrets.OW_DB_USER_STAGING }}
          OW_DB_PASSWORD=${{ secrets.OW_DB_PASSWORD_STAGING }}
          EOF

      - name: Write openwearables.env
        run: |
          cat <<'EOF' > openwearables.env
          ${{ secrets.OPENWEARABLES_ENV_STAGING }}
          EOF

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY_STAGING }}

      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.DEPLOY_HOST_STAGING }}" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy directory exists
        run: |
          ssh ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }} \
            "mkdir -p ${{ env.DEPLOY_DIR }}"

      - name: Copy compose file and env to server
        run: |
          scp docker/stacks/pt-server/docker-compose.yml \
            ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }}:${{ env.DEPLOY_DIR }}/docker-compose.yml
          scp .env \
            ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }}:${{ env.DEPLOY_DIR }}/.env
          scp openwearables.env \
            ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }}:${{ env.DEPLOY_DIR }}/openwearables.env

      - name: Login to GHCR on deploy host
        run: |
          ssh ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Pull & deploy
        run: |
          ssh ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }} \
            "cd ${{ env.DEPLOY_DIR }} && docker compose --env-file .env pull && docker compose --env-file .env up -d --remove-orphans"

      - name: Run database migrations
        run: |
          ssh ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }} \
            "cd ${{ env.DEPLOY_DIR }} && docker compose --env-file .env exec -T api pnpm migrate:latest"

      - name: Prune old images
        run: |
          ssh ${{ vars.DEPLOY_SSH_USER_STAGING }}@${{ vars.DEPLOY_HOST_STAGING }} \
            "docker image prune -f"

      - name: Cleanup local env files
        if: always()
        run: |
          rm -f .env openwearables.env

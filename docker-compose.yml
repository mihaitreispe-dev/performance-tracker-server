version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: performance-tracker-api
    restart: unless-stopped
    ports:
      - "${API_V1_PORT:-5100}:5100"
    environment:
      # Apps
      - API_V1_MODULE_ENABLED=${API_V1_MODULE_ENABLED:-Y}
      - API_V1_PORT=5100
      - CRON_MODULE_ENABLED=${CRON_MODULE_ENABLED:-Y}
      - API_V1_URL=${API_V1_URL}
      # Auth
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRY=${JWT_ACCESS_TOKEN_EXPIRY:-15m}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_EXPIRY=${JWT_REFRESH_TOKEN_EXPIRY:-}
      # Database. DB_PORT is the in-container postgres port (always 5432);
      # the host-side mapping lives under DB_EXTERNAL_PORT on the db service.
      # We deliberately don't propagate the .env DB_PORT (which is what
      # host-side scripts use to reach the mapped host port) into the
      # container — otherwise the api would try `db:5433` and fail.
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=${DB_SSL:-N}
      # AWS
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      # S3
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION}
      - S3_UPLOAD_BUCKET=${S3_UPLOAD_BUCKET}
      - S3_CONTENT_BUCKET=${S3_CONTENT_BUCKET}
      # CDN
      - CDN_URL=${CDN_URL}
      - DISABLE_CDN=${DISABLE_CDN:-N}
      # CloudFront
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID:-}
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY:-}
      # MediaConvert
      - MEDIA_CONVERT_REGION=${MEDIA_CONVERT_REGION:-}
      - MEDIA_CONVERT_ROLE=${MEDIA_CONVERT_ROLE:-}
      - MEDIA_CONVERT_QUEUE=${MEDIA_CONVERT_QUEUE:-}
      - DISABLE_MEDIA_CONVERT=${DISABLE_MEDIA_CONVERT:-N}
      # Firebase
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      # Strava
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI:-}
      - STRAVA_WEBHOOK_VERIFY_TOKEN=${STRAVA_WEBHOOK_VERIFY_TOKEN:-}
      # Garmin
      - GARMIN_CONSUMER_KEY=${GARMIN_CONSUMER_KEY:-}
      - GARMIN_CONSUMER_SECRET=${GARMIN_CONSUMER_SECRET:-}
      - GARMIN_REDIRECT_URI=${GARMIN_REDIRECT_URI:-}
      # OpenWearables
      - OPENWEARABLES_API_URL=http://openwearables:8000/api/v1
      - OPENWEARABLES_API_KEY=${OPENWEARABLES_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - performance-tracker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: performance-tracker-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    networks:
      - performance-tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Run migrations as a one-off service
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: performance-tracker-migrate
    environment:
      # In-container values — see the same note on the `api` service. The
      # host-side DB_PORT is irrelevant in-network; postgres always speaks
      # 5432 inside the docker bridge.
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=${DB_SSL:-N}
    command: ["pnpm", "migrate:latest"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - performance-tracker
    profiles:
      - migrate

  # ============================================
  # OpenWearables Services
  # ============================================

  redis:
    image: redis:8-alpine
    container_name: performance-tracker-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - performance-tracker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: performance-tracker-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_KEY}
      # Allow browser-origin PUTs to presigned URLs (snack/course/exercise-intro uploads, org logo).
      # Defaults to `*` for local dev; lock down to your actual client origin(s) in production.
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_CORS_ALLOW_ORIGIN:-*}
      # When a browser hits the API port, MinIO 307s to its idea of the console
      # URL. Without this it falls back to localhost:9001, which on a dev box
      # running multiple MinIOs collides with whichever instance bound that
      # port first — pin the redirect at this project's console so the
      # browser lands on the right UI even when other MinIOs are running.
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9003}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    networks:
      - performance-tracker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: performance-tracker-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # The content bucket is set to anonymous `download` so HLS segments
    # (referenced by relative path inside the .m3u8 playlist) and exercise
    # thumbnails can be fetched directly by the browser. This mirrors the
    # production model where CloudFront serves the content bucket publicly
    # and signed access is reserved for the upload bucket.
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${AWS_ACCESS_KEY} $${AWS_SECRET_KEY} &&
        mc mb --ignore-existing local/$${S3_UPLOAD_BUCKET} &&
        mc mb --ignore-existing local/$${S3_CONTENT_BUCKET} &&
        mc anonymous set download local/$${S3_CONTENT_BUCKET} &&
        echo 'MinIO buckets ready';
      "
    environment:
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_UPLOAD_BUCKET=${S3_UPLOAD_BUCKET}
      - S3_CONTENT_BUCKET=${S3_CONTENT_BUCKET}
    networks:
      - performance-tracker

  openwearables:
    build:
      context: ./openwearables/backend
      dockerfile: Dockerfile
    container_name: performance-tracker-openwearables
    image: performance-tracker-openwearables:latest
    restart: unless-stopped
    command: scripts/start/app.sh
    env_file:
      - ./openwearables/backend/config/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${OW_DB_NAME:-openwearables}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "${OW_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - performance-tracker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openwearables-worker:
    image: performance-tracker-openwearables:latest
    container_name: performance-tracker-openwearables-worker
    restart: unless-stopped
    command: scripts/start/worker.sh
    env_file:
      - ./openwearables/backend/config/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${OW_DB_NAME:-openwearables}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - db
      - openwearables
    networks:
      - performance-tracker

  openwearables-beat:
    image: performance-tracker-openwearables:latest
    container_name: performance-tracker-openwearables-beat
    restart: unless-stopped
    command: scripts/start/beat.sh
    env_file:
      - ./openwearables/backend/config/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${OW_DB_NAME:-openwearables}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - db
      - openwearables
    networks:
      - performance-tracker

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  performance-tracker:
    driver: bridge
